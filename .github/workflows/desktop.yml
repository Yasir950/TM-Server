# Builds the Workchime desktop installers and attaches them to a GitHub release.
# Run it from the Actions tab, or push a tag like desktop-v1.0.0.
# Mac signing turns on when these secrets exist: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
    # Pushing desktop changes to main rebuilds the desktop-latest release on its own
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing shouldn't stop the other from being released
      fail-fast: false
      matrix:
        include:
          # latest*.yml is what installed apps poll (electron-updater); the blockmaps allow small delta downloads,
          # and Mac updates install from the .zip, not the .dmg
          - os: windows-latest
            cmd: dist:win
            files: |
              desktop/dist/Workchime-Setup.exe
              desktop/dist/Workchime-Setup.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            cmd: dist:mac
            files: |
              desktop/dist/Workchime.dmg
              desktop/dist/Workchime.zip
              desktop/dist/Workchime.zip.blockmap
              desktop/dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # Installed apps only update to a higher version, so every build gets one: major.minor from package.json,
      # patch = this run's number (the same on the Windows and Mac jobs). A desktop-v1.2.3 tag uses its own version.
      - run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#desktop-v}"
          else v="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}"; fi
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "Building version $v"
        shell: bash
      # Unset secrets arrive as empty strings, and electron-builder reads an empty CSC_LINK as the current
      # directory ("not a file"), so drop them before building
      - run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!v}" ] || unset "$v"; done
          npm run ${{ matrix.cmd }} -- --publish never
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          files: ${{ matrix.files }}
          # Keep the release marked as the repo's latest: the updater looks there for latest.yml
          make_latest: true
